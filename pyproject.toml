[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ppo/craftax_baselines"]  # vendored from the Craftax repo

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008", "B023", "B905", "E402", "E731", "E741"]  # JAX idioms: env setup before import, scan closures
